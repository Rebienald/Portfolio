<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Messages Inbox | Rebienald Carpio</title>
        <link rel="icon" type="image/png" href="../images/logo.png" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

        <link rel="stylesheet" href="inbox.css">
    </head>
    <body>
        <nav class="navbar">
            <div class="nav-container">
                <div class="brand"><i class="fas fa-inbox"></i> REB.DEV INBOX</div>
                <div class="nav-right">
                    <a href="../index.html" class="btn-sharp"><i class="fas fa-arrow-left"></i> Home</a>
                    <a href="contact.html" class="btn-sharp"><i class="fas fa-paper-plane"></i> Contact</a>
                </div>
            </div>
        </nav>

        <main class="main-wrapper">
            <div class="page-header">
                <h1>Inbox</h1>
                <div class="stats-summary" id="statsSummary">Total: 0 | Unread: 0</div>
            </div>

            <div class="toolbar">
                <div class="search-box">
                    <i class="fas fa-search" style="color: var(--muted); margin-right: 0.4rem; font-size: 0.75rem"></i>
                    <input type="text" id="searchInput" placeholder="Search..." oninput="renderUI()" />
                </div>

                <div class="filter-group">
                    <button class="filter-btn active" id="filterAll" onclick="setFilter('all')">All</button>
                    <button class="filter-btn" id="filterUnread" onclick="setFilter('unread')">Unread</button>
                    <button class="filter-btn" id="filterRead" onclick="setFilter('read')">Read</button>
                </div>

                <div class="action-group">
                    <button class="btn-sharp" onclick="initData()"><i class="fas fa-sync"></i> Refresh</button>
                    <button class="btn-sharp btn-danger" onclick="clearAllMessages()">
                        <i class="fas fa-trash"></i> Clear
                    </button>
                </div>
            </div>

            <div class="messages-list" id="messagesList"></div>
        </main>

        <script src="inbox.js"></script>
    </body>
</html>
