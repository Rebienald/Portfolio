<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Rebienald Khei Carpio</title>
        <link href="../images/logo.png" rel="icon" type="image/png" />
        <link href="https://fonts.googleapis.com" rel="preconnect" />
        <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
        <link
            href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

        <link rel="stylesheet" href="contacts.css">
    </head>
    <body>
        <nav>
            <a class="logo" href="../index.html"> Reb.Dev </a>
            <ul class="nav-links">
                <li>
                    <a href="../index.html#work"> Projects </a>
                </li>
                <li>
                    <a href="../index.html#expertise"> Expertise </a>
                </li>
                <li>
                    <a href="../index.html#about"> About </a>
                </li>
                <li>
                    <a href="../index.html#certifications"> Certificates </a>
                </li>
            </ul>
            <div class="hamburger" onclick="toggleMobileMenu()">
                <i class="fas fa-bars"> </i>
            </div>
        </nav>
        <div class="mobile-menu" id="mobileMenu">
            <div class="close-menu" onclick="toggleMobileMenu()">
                <i class="fas fa-times"> </i>
            </div>
            <a href="../index.html#work" onclick="toggleMobileMenu()"> Projects </a>
            <a href="../index.html#expertise" onclick="toggleMobileMenu()"> Expertise </a>
            <a href="../index.html#about" onclick="toggleMobileMenu()"> About </a>
            <a href="../index.html#certifications" onclick="toggleMobileMenu()"> Certificates </a>
            <a href="contact.html" onclick="toggleMobileMenu()" style="color: var(--accent)"> Let's Talk ↗ </a>
        </div>
        <main class="main-content">
            <div class="container">
                <div class="contact-grid">
                    <section class="contact-form" aria-labelledby="send-message-title">
                        <h2 id="send-message-title">Send a Message</h2>
                        <div id="formStatus" style="margin-bottom: 0.5rem"></div>
                        <form id="contactForm">
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="name"> Your Name </label>
                                    <input id="name" name="name" placeholder="John Doe" required="" type="text" />
                                </div>
                                <div class="form-group">
                                    <label for="email"> Your Email </label>
                                    <input
                                        id="email"
                                        name="email"
                                        placeholder="john@example.com"
                                        required=""
                                        type="email"
                                    />
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="subject"> Subject </label>
                                <input
                                    id="subject"
                                    name="subject"
                                    placeholder="Project Inquiry"
                                    required=""
                                    type="text"
                                />
                            </div>
                            <div class="form-group">
                                <label for="message"> Your Message </label>
                                <textarea
                                    id="message"
                                    name="message"
                                    placeholder="Tell me about your project or idea..."
                                    required=""
                                ></textarea>
                            </div>
                            <button class="submit-btn" id="submitBtn" type="submit">Send Message</button>
                        </form>
                    </section>
                </div>
            </div>
        </main>
        <footer>
            <div class="container">
                <p>© 2025 Rebienald Carpio. All Rights Reserved. Engineered to scale.</p>
            </div>
        </footer>
        <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
        <script src="contacts.js"></script>
        <script src="../analytics.js"></script>
        <script defer="" src="/_vercel/insights/script.js"></script>
        
    </body>
</html>
