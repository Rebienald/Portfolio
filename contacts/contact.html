<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Contact - Rebienald Khei Carpio</title>
        <meta name="robots" content="index, follow" />
        <link rel="canonical" href="https://rebkhei.vercel.app/contacts/contact" />
        <link href="../images/logo.png" rel="icon" type="image/png" />
        <link href="https://fonts.googleapis.com" rel="preconnect" />
        <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
        <link
            href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

        <link rel="stylesheet" href="contacts.css" />
    </head>
    <body>
        <nav>
            <a class="logo" href="../index.html">Reb.Dev</a>
            <ul class="nav-links">
                <li><a href="../index.html#about">About</a></li>
                <li><a href="../index.html#testimonials">Testimonials</a></li>
                <li><a href="../index.html#work">Projects</a></li>
                <li><a href="../index.html#expertise">Expertise</a></li>
                <li><a href="../index.html#education">Education</a></li>
                <li><a href="../index.html#certifications">Certificates</a></li>
                <li class="nav-divider" aria-hidden="true"></li>
                <li><a href="../ai.html" class="nav-ai-link">AI Assistant</a></li>
            </ul>
            <div class="hamburger" onclick="toggleMobileMenu()"><i class="fas fa-bars"></i></div>
            <button
                id="muteToggleBtn"
                class="nav-mute-btn"
                title="Sound: ON (Click to mute)"
                aria-label="Toggle Sound Effects"
            >
                <i class="fas fa-volume-high"></i>
            </button>
        </nav>
        <div class="mobile-menu" id="mobileMenu">
            <div class="close-menu" onclick="toggleMobileMenu()"><i class="fas fa-times"></i></div>
            <a href="../index.html#about" onclick="toggleMobileMenu()">About</a>
            <a href="../index.html#testimonials" onclick="toggleMobileMenu()">Testimonials</a>
            <a href="../index.html#work" onclick="toggleMobileMenu()">Projects</a>
            <a href="../index.html#expertise" onclick="toggleMobileMenu()">Expertise</a>
            <a href="../index.html#education" onclick="toggleMobileMenu()">Education</a>
            <a href="../index.html#certifications" onclick="toggleMobileMenu()">Certificates</a>
            <div class="mobile-menu-divider" aria-hidden="true"></div>
            <a href="../ai.html" onclick="toggleMobileMenu()">AI Assistant</a>
        </div>
        <main class="main-content">
            <div class="container">
                <div class="contact-grid">
                    <div class="back-home">
                        <a href="../index.html" class="back-link"> <i class="fas fa-arrow-left"></i> Back to Home </a>
                    </div>
                    <section class="contact-form" aria-labelledby="send-message-title">
                        <h2 id="send-message-title">Send a Message</h2>
                        <div id="formStatus" style="margin-bottom: 0.5rem"></div>
                        <form id="contactForm">
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="name"> Your Name </label>
                                    <input id="name" name="name" placeholder="John Doe" required="" type="text" />
                                </div>
                                <div class="form-group">
                                    <label for="email"> Your Email </label>
                                    <input
                                        id="email"
                                        name="email"
                                        placeholder="john@example.com"
                                        required=""
                                        type="email"
                                    />
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="subject"> Subject </label>
                                <input
                                    id="subject"
                                    name="subject"
                                    placeholder="Project Inquiry"
                                    required=""
                                    type="text"
                                />
                            </div>
                            <div class="form-group">
                                <label for="message"> Your Message </label>
                                <textarea
                                    id="message"
                                    name="message"
                                    placeholder="Tell me about your project or idea..."
                                    required=""
                                ></textarea>
                            </div>
                            <button class="submit-btn" id="submitBtn" type="submit">
                                <i class="fas fa-paper-plane"></i> Send Message
                            </button>
                        </form>
                    </section>
                </div>
            </div>
        </main>
        <script src="contacts.js"></script>
        <script src="../analytics.js"></script>
        <script defer="" src="/_vercel/insights/script.js"></script>
    </body>
</html>
